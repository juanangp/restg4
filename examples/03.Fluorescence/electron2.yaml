g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    mainDataPath: ""
    verbose: "info"
    experimentName: "Fluorescence"
    runType: "simulation"
    runNumber: "10"
    runTag: "Electron"
    outputFileName: "Run[runNumber]_[runTag]_[experimentName].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "./setup.gdml"
    subEventTimeDelay: 100 us
    seed: 17021981
    nEvents: 30000
    registerEmptyTracks: false
    saveAllEvents: false
    storeTracks: true

    energyRangeStored: [0.0, 30.0 keV]
    activateAllVolumes: false
    activeVolumes:
      - name: "detector"
        chance: 1.0
        maxStep: 1.0 mm
        sensitive: true

    generator:
      type: "point"
      position: [0.0, 0.0, -200.0 mm]
      source:
        particle: "e-"
        angular:
          type: "flux"
          direction: [0.0, 0.0, 1.0]
        energy:
          type: "mono"
          energy: 30.0 keV

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 0.01
    cutForElectron: 2.0
    cutForPositron: 1.0
    cutForMuon: 1.0
    cutForNeutron: 1.0
    minEnergyRangeProductionCuts: 1.0 keV
    maxEnergyRangeProductionCuts: 1.0 MeV

    physicsList:
      - name: "G4EmStandardPhysics_option4"
