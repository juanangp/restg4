g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    mainDataPath: ""
    verbose: "info"
    experimentName: "Recoils"
    runType: "simulation"
    runNumber: "10"
    runTag: "${ENV:REST_ISOTOPE}"
    outputFileName: "Run[runNumber]_[runTag]_[experimentName].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "./setup.gdml"
    subEventTimeDelay: 100 us
    seed: 17021981
    nEvents: 2
    registerEmptyTracks: false
    saveAllEvents: false
    storeTracks: true

    energyRangeStored: [0.0, 30.0 keV]
    activateAllVolumes: false
    activeVolumes:
      - name: "gas"
        maxStep: 5 um
        sensitive: true

    generator:
      type: "point"
      position: [0.0, 0.0, 0.0]
      source:
        particle: "${ENV:REST_ISOTOPE}"
        angular:
          type: "isotropic"
        energy:
          type: "flat"
          range: [0.1 keV, 10 keV]

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 0.01 mm
    cutForElectron: 2.0 mm
    cutForPositron: 1.0 mm
    cutForMuon: 1.0 mm
    cutForNeutron: 1.0 mm
    minEnergyRangeProductionCuts: 1.0 keV
    maxEnergyRangeProductionCuts: 1.0 GeV
    ionLimitStepList: ["F20", "Ne20"]

    physicsList:
      - name: "G4EmStandardPhysics_option4"
        option:
          - name: "pixe"
            value: "true"
      - name: "G4DecayPhysics"
      - name: "G4RadioactiveDecayPhysics"
      - name: "G4RadioactiveDecay"
        option:
          - name: "ICM"
            value: "true"
          - name: "ARM"
            value: "true"
      - name: "G4HadronElasticPhysicsHP"
      - name: "G4IonBinaryCascadePhysics"
      - name: "G4HadronPhysicsQGSP_BIC_HP"
      - name: "G4NeutronTrackingCut"
      - name: "G4EmExtraPhysics"
